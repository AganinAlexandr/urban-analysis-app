<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Визуализация Эмбеддингов - Анализ Городской Среды</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- Plotly.js -->
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .main-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            margin: 20px auto;
            padding: 30px;
            max-width: 1400px; /* Ограничиваем ширину как в управлении эмбеддингами */
        }
        
        .header-section {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 15px;
        }
        
        .controls-section {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            border: 1px solid #e9ecef;
        }
        
        .clustering-mode-btn {
            margin: 3px;
            border-radius: 20px;
            padding: 8px 16px;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }
        
        .clustering-mode-btn.active {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        .filter-section {
            background: white;
            border-radius: 10px;
            padding: 15px;
            margin: 15px 0;
            border: 1px solid #dee2e6;
        }
        
        .chart-container-large {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin: 0;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            height: 1080px; /* 600 * 1.8 = 1080 */
            width: 100%;
        }
        
        .loading-spinner {
            text-align: center;
            padding: 50px;
            color: #667eea;
        }
        
        .stats-section {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 15px;
            margin: 15px 0;
            border: 1px solid #e9ecef;
        }
        
        .stats-card-small {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 10px;
            padding: 12px;
            text-align: center;
            margin: 5px 0;
        }
        
        .stat-number {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 3px;
        }
        
        .stat-text {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 3px;
        }
        
        .stat-label {
            font-size: 0.8rem;
            opacity: 0.9;
        }
        
        .back-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 20px;
            padding: 10px 20px;
            color: white;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }
        
                 .back-btn:hover {
             transform: translateY(-2px);
             box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
         }
         
         /* Стили для фильтров-чекбоксов */
         .filter-subtitle {
             font-size: 0.9rem;
             font-weight: 600;
             color: #495057;
             margin-bottom: 10px;
             text-align: center;
         }
         
         .checkbox-filters {
             max-height: 200px;
             overflow-y: auto;
             padding: 10px;
             background: #f8f9fa;
             border-radius: 8px;
             border: 1px solid #dee2e6;
         }
         
         .object-filters {
             max-height: 300px;
             max-width: 100%;
         }
         
         .checkbox-item {
             display: flex;
             align-items: center;
             margin-bottom: 8px;
             padding: 5px;
             border-radius: 5px;
             transition: background-color 0.2s;
         }
         
         .checkbox-item:hover {
             background-color: #e9ecef;
         }
         
         .checkbox-item input[type="checkbox"] {
             margin-right: 8px;
             transform: scale(1.1);
         }
         
         .checkbox-item label {
             font-size: 0.85rem;
             margin: 0;
             cursor: pointer;
             user-select: none;
             flex: 1;
             overflow: hidden;
             text-overflow: ellipsis;
             white-space: nowrap;
         }
         
         .object-name {
             max-width: 120px; /* Ограничиваем ширину названия объекта */
             overflow: hidden;
             text-overflow: ellipsis;
             white-space: nowrap;
         }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="main-container">
            <!-- Заголовок -->
            <div class="header-section">
                <h1><i class="fas fa-cube"></i> 3D Визуализация Эмбеддингов</h1>
                <p class="mb-0">Интерактивная 3D диаграмма с тремя режимами кластеризации</p>
            </div>
            
            <!-- Основной контент в две колонки -->
            <div class="row">
                <!-- Левая колонка - управление -->
                <div class="col-md-4">
                    <!-- Кнопка возврата -->
                    <div class="text-start mb-3">
                        <a href="/embeddings" class="btn back-btn">
                            <i class="fas fa-arrow-left"></i> Назад к управлению эмбеддингами
                        </a>
                    </div>
                    
                                         <!-- Управление режимами кластеризации -->
                     <div class="controls-section">
                         <h5><i class="fas fa-layer-group"></i> Режим кластеризации:</h5>
                         <div class="d-flex flex-wrap justify-content-start">
                             <button class="btn btn-primary clustering-mode-btn active" data-mode="groups">
                                 <i class="fas fa-map-marker-alt"></i> Группы
                             </button>
                             <button class="btn btn-success clustering-mode-btn" data-mode="sentiment">
                                 <i class="fas fa-heart"></i> Сентимент
                             </button>
                             <button class="btn btn-warning clustering-mode-btn" data-mode="groups_sentiment">
                                 <i class="fas fa-venn-diagram"></i> Группы+Сентимент
                             </button>
                         </div>
                     </div>
                     
                     <!-- Статистика -->
                     <div class="stats-section">
                         <h6><i class="fas fa-chart-bar"></i> Статистика:</h6>
                         <div class="row">
                             <div class="col-6">
                                 <div class="stats-card-small">
                                     <div class="stat-number" id="totalRecords">-</div>
                                     <div class="stat-label">Записей</div>
                                 </div>
                             </div>
                             <div class="col-6">
                                 <div class="stats-card-small">
                                     <div class="stat-number" id="totalClusters">-</div>
                                     <div class="stat-label">Кластеров</div>
                                 </div>
                             </div>
                         </div>
                         <div class="row mt-2">
                             <div class="col-6">
                                 <div class="stats-card-small">
                                     <div class="stat-text" id="currentMode">Группы</div>
                                     <div class="stat-label">Режим</div>
                                 </div>
                             </div>
                             <div class="col-6">
                                 <div class="stats-card-small">
                                     <div class="stat-text" id="dataStatus">Загрузка...</div>
                                     <div class="stat-label">Статус</div>
                                 </div>
                             </div>
                         </div>
                     </div>
                     
                     <!-- Фильтры -->
                     <div class="filter-section">
                         <h6><i class="fas fa-filter"></i> Фильтры:</h6>
                         <div class="row">
                             <!-- Группы -->
                             <div class="col-4">
                                 <h6 class="filter-subtitle">Группы:</h6>
                                 <div id="groupFilters" class="checkbox-filters">
                                     <!-- Группы будут добавлены динамически -->
                                 </div>
                             </div>
                             
                             <!-- Сентименты -->
                             <div class="col-4">
                                 <h6 class="filter-subtitle">Сентименты:</h6>
                                 <div id="sentimentFilters" class="checkbox-filters">
                                     <!-- Сентименты будут добавлены динамически -->
                                 </div>
                             </div>
                             
                             <!-- Объекты -->
                             <div class="col-4">
                                 <h6 class="filter-subtitle">Объекты:</h6>
                                 <div id="objectFilters" class="checkbox-filters object-filters">
                                     <!-- Объекты будут добавлены динамически -->
                                 </div>
                             </div>
                         </div>
                     </div>
                </div>
                
                <!-- Правая колонка - 3D диаграмма -->
                <div class="col-md-8">
                    <div class="chart-container-large">
                        <div id="loadingSpinner" class="loading-spinner">
                            <div class="spinner-border" role="status">
                                <span class="visually-hidden">Загрузка...</span>
                            </div>
                            <p class="mt-3">Загружаем данные для 3D визуализации...</p>
                        </div>
                        <div id="3dChart" style="display: none;"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        // Глобальные переменные
        let currentData = [];
        let currentMode = 'groups';
        let plotlyChart = null;
        
        // Инициализация при загрузке страницы
        document.addEventListener('DOMContentLoaded', function() {
            initializeFilters();
            loadData();
            setupEventListeners();
        });
        
        // Настройка обработчиков событий
        function setupEventListeners() {
            // Переключение режимов кластеризации
            document.querySelectorAll('.clustering-mode-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    // Убираем активный класс у всех кнопок
                    document.querySelectorAll('.clustering-mode-btn').forEach(b => b.classList.remove('active'));
                    // Добавляем активный класс к нажатой кнопке
                    this.classList.add('active');
                    
                    currentMode = this.dataset.mode;
                    document.getElementById('currentMode').textContent = getModeDisplayName(currentMode);
                    
                    loadData();
                });
            });
            
                         // Фильтры теперь обрабатываются через addEventListener в initializeFilters, updateObjectFilter и updateSentimentFilter
        }
        
        // Получение отображаемого названия режима
        function getModeDisplayName(mode) {
            const names = {
                'groups': 'Группы',
                'sentiment': 'Сентимент',
                'groups_sentiment': 'Группы+Сентимент'
            };
            return names[mode] || mode;
        }
        
                 // Инициализация фильтров
         function initializeFilters() {
             // Заполняем фильтр групп с правильными названиями из базы данных
             const groupFilters = document.getElementById('groupFilters');
             const groups = ['school', 'hospital', 'university', 'pharmacy', 'kindergarden', 'polyclinic', 'shopmall', 'resident_complex'];
             
             // Маппинг для отображения русских названий
             const groupDisplayNames = {
                 'school': 'Школа',
                 'hospital': 'Больница',
                 'university': 'Университет',
                 'pharmacy': 'Аптека',
                 'kindergarden': 'Детский сад',
                 'polyclinic': 'Поликлиника',
                 'shopmall': 'Торговый центр',
                 'resident_complex': 'Жилой комплекс'
             };
             
             groups.forEach(group => {
                 const checkboxItem = document.createElement('div');
                 checkboxItem.className = 'checkbox-item';
                 
                 const checkbox = document.createElement('input');
                 checkbox.type = 'checkbox';
                 checkbox.id = `group_${group}`;
                 checkbox.value = group;
                 checkbox.checked = true; // По умолчанию все группы выбраны
                 checkbox.addEventListener('change', applyFilters);
                 
                 const label = document.createElement('label');
                 label.htmlFor = `group_${group}`;
                 label.textContent = groupDisplayNames[group] || group;
                 
                 checkboxItem.appendChild(checkbox);
                 checkboxItem.appendChild(label);
                 groupFilters.appendChild(checkboxItem);
             });
             
             // Фильтры сентиментов и объектов будут заполняться динамически после загрузки данных
         }
        
        // Загрузка данных
        async function loadData() {
            try {
                showLoading(true);
                document.getElementById('dataStatus').textContent = 'Загрузка...';
                
                const response = await fetch(`/embeddings/3d-visualization-data?mode=${currentMode}&limit=1000`);
                const result = await response.json();
                
                if (result.success) {
                    currentData = result.data;
                    console.log(`📊 Загружено данных: ${currentData.length}`);
                    console.log('📋 Структура первой записи:', currentData[0]);
                    console.log('🏷️ Уникальные группы:', [...new Set(currentData.map(item => item.group_name))]);
                    console.log('💭 Уникальные сентименты:', [...new Set(currentData.map(item => item.sentiment))]);
                    console.log('🏢 Уникальные объекты:', [...new Set(currentData.map(item => item.object_name))].slice(0, 5));
                    
                    updateStats();
                    updateObjectFilter();
                    updateSentimentFilter();
                    create3DVisualization();
                } else {
                    throw new Error(result.message || 'Ошибка загрузки данных');
                }
            } catch (error) {
                console.error('Ошибка загрузки данных:', error);
                document.getElementById('dataStatus').textContent = 'Ошибка';
                showError('Не удалось загрузить данные: ' + error.message);
            } finally {
                showLoading(false);
            }
        }
        
        // Обновление статистики
        function updateStats() {
            document.getElementById('totalRecords').textContent = currentData.length;
            
            let totalClusters;
            if (currentMode === 'groups') {
                // В режиме "Группы" считаем уникальные группы + уникальные объекты
                const uniqueGroups = new Set(currentData.map(item => item.group_name));
                const uniqueObjects = new Set(currentData.map(item => item.object_name));
                totalClusters = uniqueGroups.size + uniqueObjects.size;
            } else {
                // В других режимах считаем уникальные кластеры
                const uniqueClusters = new Set(currentData.map(item => item.cluster));
                totalClusters = uniqueClusters.size;
            }
            
            document.getElementById('totalClusters').textContent = totalClusters;
            
            // Обновляем режим и статус
            document.getElementById('currentMode').textContent = getModeDisplayName(currentMode);
            document.getElementById('dataStatus').textContent = 'Готово';
        }
        
                 // Обновление фильтра объектов
         function updateObjectFilter() {
             const objectFilters = document.getElementById('objectFilters');
             objectFilters.innerHTML = '';
             
             const uniqueObjects = [...new Set(currentData.map(item => item.object_name))].sort();
             uniqueObjects.forEach(objectName => {
                 if (objectName && objectName.trim()) {
                     const checkboxItem = document.createElement('div');
                     checkboxItem.className = 'checkbox-item';
                     
                     const checkbox = document.createElement('input');
                     checkbox.type = 'checkbox';
                     checkbox.id = `object_${objectName.replace(/\s+/g, '_')}`;
                     checkbox.value = objectName;
                     checkbox.checked = true; // По умолчанию все объекты выбраны
                     checkbox.addEventListener('change', applyFilters);
                     
                     const label = document.createElement('label');
                     label.htmlFor = `object_${objectName.replace(/\s+/g, '_')}`;
                     label.className = 'object-name';
                     label.textContent = objectName;
                     
                     checkboxItem.appendChild(checkbox);
                     checkboxItem.appendChild(label);
                     objectFilters.appendChild(checkboxItem);
                 }
             });
         }
         
         // Обновление фильтра сентиментов
         function updateSentimentFilter() {
             const sentimentFilters = document.getElementById('sentimentFilters');
             sentimentFilters.innerHTML = '';
             
             const uniqueSentiments = [...new Set(currentData.map(item => item.sentiment))].sort();
             uniqueSentiments.forEach(sentiment => {
                 if (sentiment && sentiment.trim()) {
                     const checkboxItem = document.createElement('div');
                     checkboxItem.className = 'checkbox-item';
                     
                     const checkbox = document.createElement('input');
                     checkbox.type = 'checkbox';
                     checkbox.id = `sentiment_${sentiment.replace(/\s+/g, '_')}`;
                     checkbox.value = sentiment;
                     checkbox.checked = true; // По умолчанию все сентименты выбраны
                     checkbox.addEventListener('change', applyFilters);
                     
                     const label = document.createElement('label');
                     label.htmlFor = `sentiment_${sentiment.replace(/\s+/g, '_')}`;
                     label.textContent = sentiment;
                     
                     checkboxItem.appendChild(checkbox);
                     checkboxItem.appendChild(label);
                     sentimentFilters.appendChild(checkboxItem);
                 }
             });
         }
        
                 // Применение фильтров
         function applyFilters() {
             // Получаем выбранные группы
             const selectedGroups = [];
             document.querySelectorAll('#groupFilters input[type="checkbox"]:checked').forEach(checkbox => {
                 selectedGroups.push(checkbox.value);
             });
             
             // Получаем выбранные сентименты
             const selectedSentiments = [];
             document.querySelectorAll('#sentimentFilters input[type="checkbox"]:checked').forEach(checkbox => {
                 selectedSentiments.push(checkbox.value);
             });
             
             // Получаем выбранные объекты
             const selectedObjects = [];
             document.querySelectorAll('#objectFilters input[type="checkbox"]:checked').forEach(checkbox => {
                 selectedObjects.push(checkbox.value);
             });
             
             console.log('Применяем фильтры:', { 
                 selectedGroups, 
                 selectedSentiments, 
                 selectedObjects 
             });
             console.log('Всего данных до фильтрации:', currentData.length);
             
             let filteredData = currentData.filter(item => {
                 // Проверяем группу
                 if (selectedGroups.length > 0 && !selectedGroups.includes(item.group_name)) {
                     return false;
                 }
                 
                 // Проверяем объект
                 if (selectedObjects.length > 0 && !selectedObjects.includes(item.object_name)) {
                     return false;
                 }
                 
                 // Проверяем сентимент
                 if (selectedSentiments.length > 0 && !selectedSentiments.includes(item.sentiment)) {
                     return false;
                 }
                 
                 return true;
             });
             
             console.log('Данных после фильтрации:', filteredData.length);
             
             if (filteredData.length === 0) {
                 console.log('⚠️ Нет данных после фильтрации - показываем все данные');
                 create3DVisualization(currentData);
             } else {
                 create3DVisualization(filteredData);
             }
         }
        
        // Создание 3D визуализации
        function create3DVisualization(data = currentData) {
            if (!data || data.length === 0) {
                showError('Нет данных для визуализации');
                return;
            }
            
            // Получаем уникальные кластеры для цветовой схемы
            const uniqueClusters = [...new Set(data.map(item => item.cluster))];
            
            // Создаем данные для Plotly
            let plotData = [];
            
            if (currentMode === 'groups') {
                // В режиме "Группы" показываем ВСЕ вектора
                
                                 // 1. Сначала добавляем review_embedding (мелкие маркеры)
                 uniqueClusters.forEach((cluster) => {
                     const clusterData = data.filter(item => item.cluster === cluster);
                     const markerColor = getGroupColor(cluster);
                     
                     // Фильтруем только записи с review_embedding
                     const reviewData = clusterData.filter(item => item.review_embedding);
                     if (reviewData.length > 0) {
                         plotData.push({
                             x: reviewData.map(item => item.review_embedding[0]),
                             y: reviewData.map(item => item.review_embedding[1]),
                             z: reviewData.map(item => item.review_embedding[2]),
                             mode: 'markers',
                             type: 'scatter3d',
                             name: cluster, // Только название группы
                             marker: {
                                 size: 5,
                                 color: markerColor,
                                 opacity: 0.8
                             },
                             text: reviewData.map(item => 
                                 `Отзыв: ${item.review_text.substring(0, 100)}...<br>` +
                                 `Объект: ${item.object_name}<br>` +
                                 `Группа: ${item.group_name}<br>` +
                                 `Сентимент: ${item.sentiment}<br>` +
                                 `Рейтинг: ${item.rating}`
                             ),
                             hovertemplate: '<b>%{text}</b><extra></extra>'
                         });
                     }
                 });
                 
                 // 2. Затем добавляем object_embedding (крупные маркеры) - БЕЗ отображения в легенде
                 const uniqueObjects = [...new Set(data.map(item => item.object_name))];
                 uniqueObjects.forEach((objectName) => {
                     const objectData = data.filter(item => item.object_name === objectName && item.object_embedding);
                     if (objectData.length > 0) {
                         const firstItem = objectData[0]; // Берем первую запись объекта
                         const markerColor = getGroupColor(firstItem.group_name);
                         
                         plotData.push({
                             x: [firstItem.object_embedding[0]],
                             y: [firstItem.object_embedding[1]],
                             z: [firstItem.object_embedding[2]],
                             mode: 'markers',
                             type: 'scatter3d',
                             name: '', // Пустое имя - не будет отображаться в легенде
                             showlegend: false, // Скрываем из легенды
                             marker: {
                                 size: 12,
                                 color: markerColor,
                                 opacity: 0.9,
                                 symbol: 'diamond' // Ромб для отличия от отзывов
                             },
                             text: [`Объект: ${objectName}<br>Группа: ${firstItem.group_name}`],
                             hovertemplate: '<b>%{text}</b><extra></extra>'
                         });
                     }
                 });
                
            } else {
                // В режимах "Сентимент" и "Группы+Сентимент" показываем только review_embedding
                uniqueClusters.forEach((cluster) => {
                    const clusterData = data.filter(item => item.cluster === cluster);
                    
                    // Определяем цвет в зависимости от режима кластеризации
                    let markerColor;
                    if (currentMode === 'sentiment') {
                        markerColor = getSentimentColor(cluster);
                        console.log(`Кластер сентимента: "${cluster}" -> цвет: ${markerColor}`);
                    } else {
                        markerColor = getClusterColor(cluster, uniqueClusters);
                        console.log(`Комбинированный кластер: "${cluster}" -> цвет: ${markerColor}`);
                    }
                    
                    // Фильтруем только записи с review_embedding
                    const reviewData = clusterData.filter(item => item.review_embedding);
                    if (reviewData.length > 0) {
                        plotData.push({
                            x: reviewData.map(item => item.review_embedding[0]),
                            y: reviewData.map(item => item.review_embedding[1]),
                            z: reviewData.map(item => item.review_embedding[2]),
                            mode: 'markers',
                            type: 'scatter3d',
                            name: cluster,
                            marker: {
                                size: 5,
                                color: markerColor,
                                opacity: 0.8
                            },
                            text: reviewData.map(item => 
                                `Отзыв: ${item.review_text.substring(0, 100)}...<br>` +
                                `Объект: ${item.object_name}<br>` +
                                `Группа: ${item.group_name}<br>` +
                                `Сентимент: ${item.sentiment}<br>` +
                                `Рейтинг: ${item.rating}`
                            ),
                            hovertemplate: '<b>%{text}</b><extra></extra>'
                        });
                    }
                });
            }
            
            // Настройки макета
            const layout = {
                title: `3D Визуализация Эмбеддингов - Режим: ${getModeDisplayName(currentMode)}`,
                scene: {
                    xaxis: { title: 'Компонента 1' },
                    yaxis: { title: 'Компонента 2' },
                    zaxis: { title: 'Компонента 3' }
                },
                margin: { l: 0, r: 0, b: 0, t: 30 },
                height: 1080
            };
            
            // Создаем или обновляем график
            if (plotlyChart) {
                Plotly.react('3dChart', plotData, layout);
            } else {
                plotlyChart = Plotly.newPlot('3dChart', plotData, layout);
            }
            
            document.getElementById('3dChart').style.display = 'block';
        }
        
        // Цвета для сентиментов (как в таблице сентиментов)
        function getSentimentColor(sentiment) {
            // Очищаем название кластера от лишних символов
            const cleanSentiment = sentiment.toString().toLowerCase().trim();
            
            // Определяем цвет на основе данных от YandexGPT
            if (cleanSentiment.includes('положительный') || cleanSentiment.includes('positive')) {
                return '#28a745';    // Зеленый
            } else if (cleanSentiment.includes('нейтральный') || cleanSentiment.includes('neutral')) {
                return '#ffc107';    // Желтый
            } else if (cleanSentiment.includes('отрицательный') || cleanSentiment.includes('negative')) {
                return '#dc3545';    // Красный
            } else if (cleanSentiment.includes('отсутствует') || cleanSentiment.includes('undefined') || 
                       cleanSentiment.includes('unknown') || cleanSentiment.includes('none')) {
                return '#6c757d';    // Серый
            }
            
            // Если не удалось определить, используем автоматический цвет
            console.log('Неизвестный сентимент:', sentiment, '-> используем автоматический цвет');
            return '#17a2b8'; // Голубой для неизвестных сентиментов
        }
        
        // Цвета для групп (как на карте)
        function getGroupColor(groupName) {
            // Очищаем название кластера от лишних символов
            const cleanGroup = groupName.toString().toLowerCase().trim();
            
            // Определяем цвет на основе данных от YandexGPT
            if (cleanGroup.includes('школа') || cleanGroup.includes('school')) {
                return '#007bff';           // Синий
            } else if (cleanGroup.includes('больница') || cleanGroup.includes('hospital')) {
                return '#dc3545';           // Красный
            } else if (cleanGroup.includes('университет') || cleanGroup.includes('university')) {
                return '#6f42c1';           // Фиолетовый
            } else if (cleanGroup.includes('аптека') || cleanGroup.includes('pharmacy')) {
                return '#fd7e14';           // Оранжевый
            } else if (cleanGroup.includes('детский сад') || cleanGroup.includes('kindergarten') || cleanGroup.includes('kindergarden')) {
                return '#20c997';           // Бирюзовый
            } else if (cleanGroup.includes('поликлиника') || cleanGroup.includes('clinic')) {
                return '#e83e8c';           // Розовый
            } else if (cleanGroup.includes('торговый центр') || cleanGroup.includes('mall')) {
                return '#ffc107';           // Желтый
            } else if (cleanGroup.includes('жилой комплекс') || cleanGroup.includes('residential')) {
                return '#6c757d';           // Серый
            }
            
            // Если не удалось определить, используем автоматический цвет
            console.log('Неизвестная группа:', groupName, '-> используем автоматический цвет');
            return '#17a2b8'; // Голубой для неизвестных групп
        }
        
        // Автоматическая цветовая схема для комбинированного режима
        function getClusterColor(cluster, allClusters) {
            const clusterIndex = allClusters.indexOf(cluster);
            const colors = [
                '#1f77b4', '#ff7f0e', '#2ca02c', '#d62728', '#9467bd',
                '#8c564b', '#e377c2', '#7f7f7f', '#bcbd22', '#17becf',
                '#a6cee3', '#fb9a99', '#fdbf6f', '#cab2d6', '#ffff99',
                '#b15928', '#fdb462', '#b3de69', '#fccde5', '#d9d9d9'
            ];
            
            if (clusterIndex < colors.length) {
                return colors[clusterIndex];
            }
            
            // Генерируем дополнительные цвета если нужно больше
            const hue = (clusterIndex * 137.508) % 360; // Золотой угол для равномерного распределения
            return `hsl(${hue}, 70%, 60%)`;
        }
        
        // Показать/скрыть загрузку
        function showLoading(show) {
            const loadingSpinner = document.getElementById('loadingSpinner');
            const chart = document.getElementById('3dChart');
            
            if (show) {
                loadingSpinner.style.display = 'block';
                chart.style.display = 'none';
            } else {
                loadingSpinner.style.display = 'none';
            }
        }
        
        // Показать ошибку
        function showError(message) {
            const chartContainer = document.getElementById('3dChart');
            chartContainer.innerHTML = `
                <div class="alert alert-danger" role="alert">
                    <i class="fas fa-exclamation-triangle"></i> ${message}
                </div>
            `;
            chartContainer.style.display = 'block';
        }
    </script>
